  </div>

    <span style="font-family: 'IBM Plex Mono', Menlo, monospace; font-size: 9px; letter-spacing: 1.5px; color: #6E6E72;">TRADEOFF</span>
    <span style="font-size: 12px; line-height: 1.5; color: #A8A8AC;">Nearly invisible on white — a light theme would need a darker shade of it.</span>
  </div>
